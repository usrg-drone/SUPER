goal_pub_topic: "/goal_pose"
goal_frame_id: "camera_init"
odom_topic: "/Odometry"
# 0 for RViz click, 1 for MAVROS RC channel 10 falling edge, 2 for start after delay.
# Service-controlled missions should leave this at -1 and use /mission/start.
start_trigger_type: -1
prepare_offboard_on_start: true
require_mavros_armed: true
start_program_delay: 3.0
# 0 for path and 1 for waypoints.
cmd_type: 1
# Fallback waypoint switch distance. Each waypoint row can also provide its own.
switch_dis: 1.0
odom_timeout: 0.5
# Set high so each waypoint goal is published once when selected.
publish_dt: 99999.0
